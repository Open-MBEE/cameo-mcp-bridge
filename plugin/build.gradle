plugins {
    id 'java'
}

def cameoTarget = providers.gradleProperty('cameoTarget').getOrElse('2024x')
if (!(cameoTarget in ['2022x', '2024x'])) {
    throw new GradleException('cameoTarget must be 2022x or 2024x')
}
def javaRelease = cameoTarget == '2022x' ? 11 : 17
layout.buildDirectory = layout.projectDirectory.dir("build/${cameoTarget}")
def windows = System.getProperty('os.name').toLowerCase().contains('windows')
def javaBinary = windows ? 'java.exe' : 'java'

def cameoHome = project.hasProperty('cameoHome')
    ? project.property('cameoHome')
    : 'D:/DevTools/CatiaMagic'

def jdk17Home = project.hasProperty('jdk17Home')
    ? project.property('jdk17Home')
    : (System.getenv('JDK17_HOME') ?: System.getenv('JAVA17_HOME'))

java {
    sourceCompatibility = JavaVersion.toVersion(javaRelease)
    targetCompatibility = JavaVersion.toVersion(javaRelease)
}

repositories { mavenCentral() }

def validateSdk = tasks.register('validateSdk') {
    inputs.property('cameoTarget', cameoTarget)
    doLast {
        ['lib/md.jar', 'lib/md_api.jar', 'lib/junit-4.13.2.jar',
         'plugins/com.nomagic.magicdraw.dependencymatrix/dependencymatrix_api.jar',
         'plugins/com.nomagic.magicdraw.diagramtable/diagramtable_api.jar',
         'plugins/com.nomagic.magicdraw.relationshipmap/relationshipmap_api.jar'].each {
            if (!file("${cameoHome}/${it}").isFile()) throw new GradleException("Missing SDK dependency: ${cameoHome}/${it}")
        }
        ['com.nomagic.magicdraw.emfuml2xmi_v5', 'com.nomagic.magicdraw.diagramtable',
         'com.nomagic.magicdraw.relationshipmap'].each {
            def descriptor = file("${cameoHome}/plugins/${it}/plugin.xml")
            if (!descriptor.isFile() || !(descriptor.text =~ /(?s)<plugin\b[^>]*\bversion=["']${cameoTarget}(?: [^"']*)?["']/).find()) {
                throw new GradleException("SDK plugin ${it} does not match target ${cameoTarget}: ${descriptor}")
            }
        }
    }
}


sourceSets {
    main {
        java {
            srcDirs = ['src/com']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
    }
}

dependencies {
    compileOnly fileTree(dir: "${cameoHome}/plugins/com.nomagic.magicdraw.emfuml2xmi_v5", include: ['*_api.jar'])
    compileOnly fileTree(dir: "${cameoHome}/lib", include: ['md.jar'])
    compileOnly fileTree(dir: "${cameoHome}/lib", include: ['md_api.jar'])
    compileOnly fileTree(dir: "${cameoHome}/lib", include: ['com.nomagic.ci.persistence-*.jar'])
    compileOnly fileTree(dir: "${cameoHome}/lib", include: ['com.nomagic.magicdraw.uml2-*.jar'])
    compileOnly fileTree(dir: "${cameoHome}/lib", include: ['com.nomagic.magicdraw.foundation-*.jar'])
    compileOnly fileTree(dir: "${cameoHome}/lib", include: ['com.nomagic.magicdraw.core.diagram-*.jar'])
    compileOnly fileTree(dir: "${cameoHome}/lib", include: ['com.nomagic.magicdraw.modeling-*.jar'])
    compileOnly fileTree(dir: "${cameoHome}/lib", include: ['com.nomagic.utils-*.jar'])
    compileOnly fileTree(dir: "${cameoHome}/lib", include: ['com.dassault_systemes.modeler.foundation-*.jar'])
    compileOnly fileTree(dir: "${cameoHome}/lib", include: ['common-*.jar'])
    compileOnly fileTree(dir: "${cameoHome}/lib", include: ['org.eclipse.emf.ecore-*.jar'])
    compileOnly fileTree(dir: "${cameoHome}/lib", include: ['org.eclipse.emf.common-*.jar'])
    compileOnly fileTree(dir: "${cameoHome}/lib", include: ['javax.jmi-*.jar'])
    compileOnly fileTree(dir: "${cameoHome}/lib", include: ['gson-*.jar'])
    compileOnly fileTree(dir: "${cameoHome}/lib", include: ['cmof-*.jar'])
    compileOnly files("${cameoHome}/plugins/com.nomagic.magicdraw.dependencymatrix/dependencymatrix_api.jar")
    compileOnly files("${cameoHome}/plugins/com.nomagic.magicdraw.diagramtable/diagramtable_api.jar")
    compileOnly files("${cameoHome}/plugins/com.nomagic.magicdraw.relationshipmap/relationshipmap_api.jar")

    testImplementation files("${cameoHome}/lib/junit-4.13.2.jar")
    testImplementation fileTree(dir: "${cameoHome}/lib", include: ['gson-*.jar'])
    testRuntimeOnly 'org.hamcrest:hamcrest-core:1.3'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:-deprecation', '-Xlint:-unchecked']
    if (jdk17Home) {
        options.fork = true
        options.forkOptions.javaHome = file(jdk17Home)
    }
    dependsOn validateSdk
    options.release = javaRelease
}

tasks.withType(Test).configureEach {
    useJUnit()
    systemProperty 'cameoHome', cameoHome
    systemProperty 'expectedCameoTarget', cameoTarget
    def testJavaHome = project.findProperty('testJavaHome') ?: (cameoTarget == '2022x' ? "${cameoHome}/jre" : jdk17Home)
    if (testJavaHome) executable = file("${testJavaHome}/bin/${javaBinary}").absolutePath
    doFirst {
        if (cameoTarget == '2022x' && !file(executable).isFile()) {
            throw new GradleException('2022x tests require Java 11; supply -PtestJavaHome=/path/to/java11')
        }
    }
}

jar {
    archiveBaseName = 'cameo-mcp-bridge'
    archiveVersion = '3.1.0'
    destinationDirectory = layout.buildDirectory.dir('libs')
}

def generatedMetadata = layout.buildDirectory.dir('generated-metadata')
def generatedResources = layout.buildDirectory.dir('generated-resources')
def generateMetadata = tasks.register('generateMetadata') {
    inputs.files('plugin.xml', 'resource-descriptor.xml')
    inputs.property('cameoTarget', cameoTarget)
    outputs.dir(generatedMetadata)
    outputs.dir(generatedResources)
    doLast {
        def metadata = generatedMetadata.get().asFile
        def resources = generatedResources.get().asFile
        metadata.mkdirs(); resources.mkdirs()
        new File(metadata, 'plugin.xml').text = file('plugin.xml').text.replace('version="2024x"', 'version="' + cameoTarget + '"')
        new File(metadata, 'resource-descriptor.xml').text = file('resource-descriptor.xml').text
            .replace('mdVersionMin="2024x"', 'mdVersionMin="' + cameoTarget + '"')
            .replace('mdVersionMax="higher"', cameoTarget == '2022x' ? 'mdVersionMax="2022x"' : 'mdVersionMax="higher"')
        new File(resources, 'cameo-bridge-build.properties').text = "cameoTarget=${cameoTarget}\njavaRelease=${javaRelease}\n"
    }
}
sourceSets.main.resources.srcDir(generatedResources)
tasks.named('processResources') { dependsOn generateMetadata }

tasks.register('assemblePlugin', Sync) {
    dependsOn jar
    dependsOn generateMetadata
    from(generatedMetadata.map { it.file('plugin.xml') })
    from(jar.archiveFile)
    into(layout.buildDirectory.dir('plugin-dist/com.claude.cameo.bridge'))
}

// Resource/Plugin Manager archives require an installation descriptor and
// paths relative to the Cameo installation root.
tasks.register('packagePlugin', Zip) {
    dependsOn assemblePlugin
    archiveFileName = "cameo-mcp-bridge-3.1.0-${cameoTarget}.zip"
    destinationDirectory = layout.buildDirectory
    from(layout.buildDirectory.dir('plugin-dist')) {
        into 'plugins'
    }
    from(generatedMetadata.map { it.file('resource-descriptor.xml') }) {
        into 'data/resourcemanager'
        rename { 'MDR_Plugin_Cameo_MCP_Bridge_11974001_descriptor.xml' }
    }
}

// Resolves API signatures only; does not initialize Cameo, install, or open models.
tasks.register('sdkLinkageSmoke', JavaExec) {
    dependsOn jar, testClasses
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath +
        fileTree(dir: "${cameoHome}/lib", include: ['*.jar']) +
        fileTree(dir: "${cameoHome}/plugins/com.nomagic.magicdraw.diagramtable", include: ['*.jar'])
    mainClass = 'com.claude.cameo.bridge.util.SdkLinkageProbe'
    def testJavaHome = project.findProperty('testJavaHome') ?: (cameoTarget == '2022x' ? "${cameoHome}/jre" : jdk17Home)
    if (testJavaHome) executable = file("${testJavaHome}/bin/${javaBinary}").absolutePath
    doFirst { args = [jar.archiveFile.get().asFile.absolutePath, javaRelease.toString()] }
}

tasks.register('deploy', Copy) {
    dependsOn assemblePlugin
    from(layout.buildDirectory.dir('plugin-dist/com.claude.cameo.bridge'))
    into("${cameoHome}/plugins/com.claude.cameo.bridge")
    doFirst {
        delete fileTree(
            dir: "${cameoHome}/plugins/com.claude.cameo.bridge",
            include: 'cameo-mcp-bridge-*.jar',
            exclude: jar.archiveFileName.get()
        )
    }
}
